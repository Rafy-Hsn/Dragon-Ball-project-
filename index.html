<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon ball Universe</title>
     <link rel="preconnect" href="https://fonts.googleapis.com" />
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
     <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet" />
     <link rel="stylesheet" href="/src/css/style.css" />
</head>
<body>
   <!-- KI ACHTERGROND EFFECT -->
    <canvas id="ki-canvas"></canvas>
    <!-- HEADER -->
    <header id="main-header">
      <div class="header-inner">
        <div class="logo">
          <span class="logo-ball">★</span>
          <span class="logo-text">Dragon Ball<br /><small>Universe</small></span>
        </div>
        <nav class="nav-tabs">
          <button class="nav-btn active" data-section="characters">⚔️ Personages</button>
          <button class="nav-btn" data-section="planets">🌍 Planeten</button>
          <button class="nav-btn" data-section="favorites">❤️ Favorieten <span id="fav-count" class="badge">0</span></button>
        </nav>
        <div class="header-actions">
          <button id="lang-toggle" class="lang-cycle-btn" title="Taal wisselen">🇧🇪 NL</button>
          <button id="theme-toggle" title="Wissel thema">🌙</button>
          <button id="notes-toggle" title="Notities">📝</button>
        </div>
      </div>
    </header>

    <!-- HERO BANNER -->
    <div class="hero-banner" id="hero-banner">
      <div class="hero-text">
        <h1>Dragon Ball Universe</h1>
        <p>Verken personages, planeten en meer!</p>
      </div>
      <div class="dragonballs">
        <span class="db db1">✦</span>
        <span class="db db2">✦</span>
        <span class="db db3">✦</span>
        <span class="db db4">✦</span>
        <span class="db db5">✦</span>
        <span class="db db6">✦</span>
        <span class="db db7">✦</span>
      </div>
    </div>
    </div>
    <!-- MAIN APP -->
    <main id="app">

      <!-- CONTROLS BAR -->
      <section class="controls-bar" id="controls-bar">
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" placeholder="Zoek een personage of planeet..." autocomplete="off" />
        </div>
        <div class="filter-wrap" id="filter-wrap">
          <!-- Filters worden dynamisch geladen per sectie -->
        </div>
        <div class="sort-wrap">
          <label for="sort-select">Sorteren:</label>
          <select id="sort-select">
            <option value="name-asc">Naam A→Z</option>
            <option value="name-desc">Naam Z→A</option>
            <option value="ki-desc" data-ki="1">Ki Hoogst</option>
            <option value="ki-asc" data-ki="1">Ki Laagst</option>
          </select>
        </div>
      </section>

      <!-- RESULTS INFO + VIEW TOGGLE -->
      <div class="results-info" id="results-info">
        <span id="results-count"></span>
        <div class="view-toggle" id="view-toggle">
          <button class="view-btn active" data-view="cards" title="Kaartweergave">⊞ Kaarten</button>
          <button class="view-btn" data-view="table" title="Tabelweergave">☰ Tabel</button>
        </div>
      </div>

      <!-- LOADING SPINNER -->
      <div id="loader" class="loader hidden">
        <div class="spinner"></div>
        <p>Data laden...</p>
      </div>

      <!-- ERROR MESSAGE -->
      <div id="error-msg" class="error-msg hidden">
        <span>⚠️</span>
        <p id="error-text">Er ging iets mis...</p>
        <button id="retry-btn">Opnieuw proberen</button>
      </div>

      <!-- CARDS GRID -->
      <section id="cards-grid" class="cards-grid"></section>

      <!-- TABLE VIEW -->
      <div id="table-wrap" class="table-wrap hidden">
        <table id="data-table" class="data-table">
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>

      <!-- PAGINATION -->
      <div class="pagination" id="pagination"></div>

    </main>
<!-- DETAIL MODAL -->
    <div id="detail-modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-overlay" id="modal-overlay"></div>
      <div class="modal-content">
        <button class="modal-close" id="modal-close">✕</button>
        <div id="modal-body"></div>
      </div>
    </div>


    <!-- NOTITIES MODAL (Formulier validatie) -->
    <div id="notes-modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-overlay" id="notes-overlay"></div>
      <div class="modal-content" style="max-width:480px">
        <button class="modal-close" id="notes-close">&#x2715;</button>
        <div style="padding:1.5rem">
          <h2 style="font-family:'Bangers',cursive;font-size:1.8rem;letter-spacing:2px;color:var(--db-yellow);margin-bottom:1.2rem">
            &#x1F4DD; Notitie toevoegen
          </h2>
          <form id="notes-form" novalidate>
            <div class="form-group">
              <label class="form-label" for="note-name">Naam *</label>
              <input type="text" id="note-name" class="form-input" placeholder="Bijv. Goku" minlength="2" maxlength="50" required autocomplete="off" />
              <span class="form-error" id="error-name"></span>
            </div>
            <div class="form-group">
              <label class="form-label" for="note-email">E-mail *</label>
              <input type="email" id="note-email" class="form-input" placeholder="jouw@email.com" required autocomplete="off" />
              <span class="form-error" id="error-email"></span>
            </div>
            <div class="form-group">
              <label class="form-label" for="note-text">Notitie * <small>(min. 10 tekens)</small></label>
              <textarea id="note-text" class="form-input" rows="4" placeholder="Schrijf hier je notitie..." minlength="10" maxlength="300" required></textarea>
              <span class="form-error" id="error-note"></span>
              <span class="char-counter" id="char-counter">0 / 300</span>
            </div>
            <div class="form-actions">
              <button type="submit" class="form-submit-btn">&#x1F4BE; Opslaan</button>
              <button type="button" class="form-cancel-btn" id="notes-cancel">Annuleren</button>
            </div>
          </form>
          <div id="saved-notes" style="margin-top:1.5rem"></div>
        </div>
      </div>
    </div>

    <!-- TOAST melding -->
    <div id="toast" class="toast hidden"></div>
    <script type="module" src="/src/js/main.js"></script>
 
</body>
</html>
